<style>
/* Layout: analyst's lab notebook. Narrative header, one filter row, KPI strip,
   map 8/12 + ranking 4/12, trend full width, SQL console last. */
:root {
  --page: #f3f4f5;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --accent-wash: rgba(42, 120, 214, 0.10);
  --nodata: #e6e6e2;
  --code-bg: #f1f2f3;
  --t-kw: #1c5cab;
  --t-str: #a24a1c;
  --t-num: #00690f;
  --t-com: #6f6d68;
  --bad: #c53030;
  --good: #0a8f0a;
  --c-asia: #2a78d6;
  --c-europe: #eb6834;
  --c-africa: #1baf7a;
  --c-namerica: #eda100;
  --c-samerica: #e87ba4;
  --c-oceania: #6250d6;

  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f1011; --surface: #19191a; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8d87;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5; --accent-ink: #ffffff; --accent-wash: rgba(57, 135, 229, 0.16);
    --nodata: #2a2a29; --code-bg: #141415;
    --t-kw: #86b6ef; --t-str: #ec835a; --t-num: #4cc36b; --t-com: #8f8d87; --bad: #e66767; --good: #0ca30c;
    --c-asia: #3987e5; --c-europe: #d95926; --c-africa: #199e70; --c-namerica: #c98500; --c-samerica: #d55181; --c-oceania: #9085e9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0f1011; --surface: #19191a; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8d87;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5; --accent-ink: #ffffff; --accent-wash: rgba(57, 135, 229, 0.16);
  --nodata: #2a2a29; --code-bg: #141415;
  --t-kw: #86b6ef; --t-str: #ec835a; --t-num: #4cc36b; --t-com: #8f8d87; --bad: #e66767; --good: #0ca30c;
  --c-asia: #3987e5; --c-europe: #d95926; --c-africa: #199e70; --c-namerica: #c98500; --c-samerica: #d55181; --c-oceania: #9085e9;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 400 15px/1.55 var(--f-body);
}
.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- top bar ---------- */
.topbar-band { border-bottom: 1px solid var(--border); }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding-block: 12px; }
.topbar-ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.gh { display: inline-flex; align-items: center; gap: 7px; font: 500 12.5px/1 var(--f-body); color: var(--ink-2); text-decoration: none;
  padding: 8px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); }
.gh:hover { color: var(--ink); border-color: var(--axis); }
.gh svg { width: 15px; height: 15px; fill: currentColor; }
.gh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font: 500 13px/1.2 var(--f-body); color: var(--ink-2); letter-spacing: 0.01em; }
.brand .mark { width: 18px; height: 18px; border-radius: 50%; flex: none;
  background: conic-gradient(var(--c-asia) 0 25%, var(--c-europe) 0 45%, var(--c-africa) 0 65%, var(--c-namerica) 0 80%, var(--c-samerica) 0 92%, var(--c-oceania) 0);
  /* donut, same as the favicon */
  -webkit-mask: radial-gradient(circle, transparent 42%, #000 44%);
  mask: radial-gradient(circle, transparent 42%, #000 44%); }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border); flex-wrap: wrap; }
.seg button {
  font: 500 13.5px/1 var(--f-body); color: var(--ink-2); background: transparent; border: 0; border-radius: 6px;
  padding: 8px 12px; cursor: pointer; transition: background .2s, color .2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.seg button:hover { color: var(--ink); background: var(--accent-wash); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg.small button { font-size: 12.5px; padding: 6px 10px; }
.seg svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }

/* ---------- header ---------- */
header.intro { padding-block: clamp(36px, 6vw, 72px) 36px; }
.eyebrow { font: 500 12px/1 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 0 0 18px; }
h1 { font: 400 clamp(38px, 6.2vw, 76px)/1.02 var(--f-display); letter-spacing: -0.022em; margin: 0; text-wrap: balance; }
.lede { font-size: clamp(16px, 1.6vw, 19px); line-height: 1.6; color: var(--ink-2); max-width: 64ch; margin: 22px 0 0; text-wrap: pretty; }
.lede strong { color: var(--ink); font-weight: 500; }

/* project facts, report-style: label / value / note, hairline-separated */
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: clamp(32px, 4vw, 48px) 0 0; border-top: 1px solid var(--border); }
.facts > div { padding: 16px 20px 0; border-left: 1px solid var(--border); min-width: 0; }
.facts > div:first-child { padding-left: 0; border-left: 0; }
.facts dt { font: 500 11px/1.2 var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; }
.facts .fv { font: 400 21px/1.25 var(--f-display); margin-top: 8px; display: flex; align-items: center; gap: 9px; overflow-wrap: anywhere; }
.facts .fv a { color: inherit; text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 3px; }
.facts .fv a:hover { text-decoration-color: var(--accent); }
.facts .fs { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

.engine .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--axis); flex: none; }
.engine[data-state="loading"] .dot { background: var(--c-namerica); animation: pulse 1.1s ease-in-out infinite; }
.engine[data-state="ready"] .dot { background: var(--good); }
.engine[data-state="error"] .dot { background: var(--bad); }
.engine[data-state="error"] .fs { color: var(--bad); }
@keyframes pulse { 50% { opacity: 0.35; } }

/* ---------- filter row ---------- */
.filters {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-block: 1px solid var(--border);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--page); }
.filters .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; padding-block: 12px; }
.f-group { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.f-label { font: 500 11px/1 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; font: 500 13px/1 var(--f-body); color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 7px 11px 7px 9px; cursor: pointer;
  transition: opacity .2s, border-color .2s;
}
.chip .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.chip[aria-pressed="false"] { opacity: 0.5; text-decoration: line-through; text-decoration-color: var(--muted); }
.chip[aria-pressed="false"] .sw { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.chip:hover { border-color: var(--axis); }

.year-ctl { display: flex; align-items: center; gap: 12px; flex: 1 1 260px; min-width: 0; }
.year-big { font: 400 30px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 2.4em; }
.play {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.play:hover { border-color: var(--accent); color: var(--accent); }
.play svg { width: 14px; height: 14px; fill: currentColor; }
input[type="range"] { flex: 1; min-width: 80px; accent-color: var(--accent); }

button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* ---------- KPI ---------- */
main { padding-block: 22px 56px; display: grid; gap: 18px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 15px; min-width: 0; }
.kpi-k { font: 500 12px/1.3 var(--f-body); color: var(--muted); }
.kpi-v { font: 400 30px/1.1 var(--f-display); margin-top: 8px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.kpi-s { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }

/* ---------- cards ---------- */
.grid { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 18px 14px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.card h2 { font: 500 21px/1.2 var(--f-display); margin: 0; text-wrap: balance; }
.card .sub { font-size: 13px; color: var(--ink-2); margin: 3px 0 0; max-width: 70ch; }
.body { position: relative; transition: opacity .2s; }
.is-busy .body { opacity: 0.55; }
.body[data-loading]::after {
  content: attr(data-loading); position: absolute; inset: 0; display: grid; place-items: center;
  font: 400 12.5px/1.4 var(--f-mono); color: var(--muted); text-align: center; padding: 16px;
}

.legend-ramp { display: grid; gap: 4px; width: 230px; max-width: 100%; }
.legend-ramp .bar { height: 10px; border-radius: 3px; background: var(--nodata); }
.legend-ramp .ticks { position: relative; height: 14px; font: 400 11px/1 var(--f-body); color: var(--muted); font-variant-numeric: tabular-nums; }
.legend-ramp .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.legend-nd { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.legend-nd i { width: 10px; height: 10px; border-radius: 2px; background: var(--nodata); display: inline-block; flex: none; }

#map { min-height: 120px; }
#map svg { display: block; width: 100%; height: auto; }
#map .c { stroke: var(--surface); stroke-width: 0.5; }
#map circle.c { stroke-width: 1.5; }
#map .c.has { cursor: pointer; }
#map .c.hover { stroke: var(--ink); stroke-width: 1.2; }

/* ranking */
.rank { position: relative; min-height: 400px; }
.rank-row { position: absolute; left: 0; right: 0; height: 40px; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; grid-template-rows: auto 8px; column-gap: 8px; row-gap: 5px; align-items: end;
  transition: transform .65s cubic-bezier(.3,.7,.2,1), opacity .35s; }
.rank-n { grid-row: 1 / 3; align-self: center; font: 400 12px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.rank-name { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-name .ct { color: var(--muted); font-size: 12px; }
.rank-val { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.rank-track { grid-column: 2 / 4; height: 8px; }
.rank-bar { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--c); transition: width .65s cubic-bezier(.3,.7,.2,1); }

/* trend */
#trend { min-height: 260px; }
#trend svg { display: block; overflow: visible; max-width: 100%; }
.axis text, .dlabel { font: 400 11.5px var(--f-body); fill: var(--muted); font-variant-numeric: tabular-nums; }
.dlabel { fill: var(--ink-2); font-size: 12px; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }
.yr-mark { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
.xhair { stroke: var(--muted); stroke-width: 1; }
.series { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.legend-lines { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend-lines span { display: inline-flex; align-items: center; gap: 6px; }
.legend-lines i { width: 14px; height: 2px; border-radius: 1px; background: var(--c); display: inline-block; }

/* disclosures (SQL + table view) */
.disclosures { border-top: 1px solid var(--border); padding-top: 10px; display: grid; gap: 8px; }
details.sql summary { cursor: pointer; font: 500 12.5px/1.4 var(--f-body); color: var(--ink-2); list-style: none; display: inline-flex; align-items: center; gap: 8px; }
details.sql summary::-webkit-details-marker { display: none; }
details.sql summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .2s; margin-right: 2px; }
details.sql[open] summary::before { transform: rotate(45deg); }
details.sql summary:hover { color: var(--accent); }
.ms { font: 400 11.5px/1 var(--f-mono); color: var(--muted); background: var(--code-bg); border-radius: 4px; padding: 3px 6px; }
pre.code { margin: 10px 0 0; padding: 12px 14px; background: var(--code-bg); border-radius: 8px; overflow-x: auto; font: 400 12.5px/1.6 var(--f-mono); color: var(--ink); }
.t-kw { color: var(--t-kw); font-weight: 500; }
.t-str { color: var(--t-str); }
.t-num { color: var(--t-num); }
.t-com { color: var(--t-com); font-style: italic; }
details .table-wrap { margin-top: 10px; max-height: 320px; }

/* console */
.console-grid { display: grid; gap: 12px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { font: 500 12.5px/1 var(--f-body); color: var(--ink-2); background: transparent; border: 1px solid var(--border); border-radius: 999px; padding: 7px 11px; cursor: pointer; }
.presets button:hover { border-color: var(--accent); color: var(--accent); }
textarea {
  width: 100%; min-height: 190px; resize: vertical; padding: 12px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--code-bg); color: var(--ink);
  font: 400 13px/1.6 var(--f-mono); tab-size: 2;
}
.run-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn { font: 500 14px/1 var(--f-body); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 11px 16px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--border); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: progress; }
.run-meta { font: 400 12.5px/1.4 var(--f-mono); color: var(--muted); }
.run-meta.err { color: var(--bad); white-space: pre-wrap; }
.table-wrap { overflow: auto; max-height: 380px; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface); font: 500 12px/1.3 var(--f-mono); color: var(--ink-2); }
td.num, th.num { text-align: right; }
tr:last-child td { border-bottom: 0; }

/* tooltip */
.tip {
  position: fixed; z-index: 50; pointer-events: none; min-width: 150px; max-width: 260px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,.12); padding: 9px 11px; font-size: 12.5px; line-height: 1.4;
}
.tip-t { font-weight: 500; margin-bottom: 4px; }
.tip-v { font: 400 19px/1.15 var(--f-display); }
.tip-s { color: var(--ink-2); }
.tip-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.tip-row i { height: 2px; border-radius: 1px; background: var(--c); }
.tip-row b { font-weight: 500; font-variant-numeric: tabular-nums; }

footer { border-top: 1px solid var(--border); padding-block: 22px 40px; font-size: 12.5px; color: var(--muted); }
footer p { margin: 0; max-width: 90ch; }
footer a { color: var(--ink-2); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

@media (max-width: 960px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 20px; }
  .facts > div:nth-child(3) { padding-left: 0; border-left: 0; }
}
@media (max-width: 560px) {
  .brand [data-i], .gh [data-i] { display: none; }
  .facts .fv { font-size: 18px; }
  .facts > div { padding-right: 12px; padding-left: 14px; }
  .kpi-v { font-size: 24px; }
  .filters { position: static; }
  .filters .wrap { gap: 10px 18px; }
  .year-big { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="topbar-band">
  <div class="wrap topbar">

  let out = "", lastIdx = 0, m;
  while ((m = re.exec(sql))) {
    out += esc(sql.slice(lastIdx, m.index));
    if (m[1]) out += `<span class="t-com">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="t-str">${esc(m[2])}</span>`;

    else out += KW.has(m[4].toUpperCase()) ? `<span class="t-kw">${m[4]}</span>` : esc(m[4]);

    row.style.opacity = "0";
    row.style.transform = `translateY(${ROW_H * 10}px)`;
    setTimeout(() => { if (row._gone) { row.remove(); rankRows.delete(k); } }, dur(450));
  }
  $("rank-sub").textContent = fill(L.rankSub, { metric: metricName(), year: state.year });
}

// ---------- trend ----------
const snapYear = (x, px) => Math.max(RANGE.from, Math.min(RANGE.to, Math.round(x.invert(px))));
function renderTrend(rows, animate) {
  const box = $("trend"), m = METRICS[state.metric];
  const W = box.clientWidth, narrow = W < 560;
  const H = narrow ? 260 : 320;
  // on narrow screens the legend above names the lines, so direct labels are dropped to keep the plot wide
  const M = { t: 12, r: narrow ? 16 : 132, b: 28, l: narrow ? 52 : 64 };
  rows = rows.filter(r => r.value != null);
  const series = d3.groups(rows, r => r.continent).map(([k, v]) => ({ key: k, values: v }));
  const x = d3.scaleLinear().domain([RANGE.from, RANGE.to]).range([M.l, W - M.r]);
  const yMax = d3.max(rows, r => r.value) || 1;
  const yMin = state.metric === "life_expectancy" ? Math.floor(((d3.min(rows, r => r.value) ?? 40) - 5) / 10) * 10 : 0;
  const y = d3.scaleLinear().domain([yMin, yMax]).nice(5).range([H - M.b, M.t]);
  const t = d3.transition().duration(animate ? dur(state.playing ? PLAY_MS - 50 : 600) : 0);

  let svg = d3.select(box).select("svg");
  if (svg.empty()) {
    svg = d3.select(box).append("svg").attr("role", "img");
    svg.append("g").attr("class", "grid-g");
    svg.append("g").attr("class", "axis x-axis");
    svg.append("line").attr("class", "yr-mark");
    svg.append("g").attr("class", "lines");
    svg.append("g").attr("class", "dots");
    svg.append("g").attr("class", "labels");
    svg.append("line").attr("class", "xhair").attr("opacity", 0);
    svg.append("rect").attr("class", "hit").attr("fill", "transparent");
  }
  svg.attr("width", W).attr("height", H).attr("viewBox", `0 0 ${W} ${H}`).attr("aria-label", L.trendAria);

  const yt = y.ticks(5);
  const g = svg.select(".grid-g").selectAll("g.tk").data(yt, d => d).join(
    en => { const gg = en.append("g").attr("class", "tk axis"); gg.append("line").attr("class", "gridline"); gg.append("text"); return gg; });
  g.select("line").attr("x1", M.l).attr("x2", W - M.r).attr("class", d => d === y.domain()[0] ? "baseline" : "gridline")
    .transition(t).attr("y1", d => y(d)).attr("y2", d => y(d));
  g.select("text").attr("x", M.l - 8).attr("text-anchor", "end").attr("dy", "0.32em").text(d => m.tick(d))
    .transition(t).attr("y", d => y(d));

  // ticks every 5 (or 10) years, plus the last year if it isn't too close to the previous tick
  const stepX = narrow ? 10 : 5;
  const xt = YEARS.filter(yr => yr % stepX === 0);
  if (RANGE.to - xt[xt.length - 1] >= stepX / 2) xt.push(RANGE.to);
  svg.select(".x-axis").selectAll("text").data(xt, d => d).join("text")
    .attr("x", d => x(d)).attr("y", H - 8).attr("text-anchor", "middle").text(d => d);

  svg.select(".yr-mark").attr("y1", M.t).attr("y2", H - M.b).transition(t).attr("x1", x(state.year)).attr("x2", x(state.year));

  const line = d3.line().x(d => x(d.year)).y(d => y(d.value)).curve(d3.curveMonotoneX);
  svg.select(".lines").selectAll("path").data(series, d => d.key).join(
    en => en.append("path").attr("class", "series").attr("d", d => line(d.values)).attr("opacity", 0))
    .style("stroke", d => `var(${CONT[d.key].c})`)
    .transition(t).attr("d", d => line(d.values)).attr("opacity", 1);

  const at = series.map(s => ({ key: s.key, d: s.values.find(v => v.year === state.year) })).filter(s => s.d);
  svg.select(".dots").selectAll("circle").data(at, d => d.key).join("circle")
    .attr("r", 4.5).style("fill", d => `var(${CONT[d.key].c})`).style("stroke", "var(--surface)").attr("stroke-width", 2)
    .transition(t).attr("cx", d => x(d.d.year)).attr("cy", d => y(d.d.value));

  const ends = series.map(s => ({ key: s.key, y: y(s.values[s.values.length - 1].value) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 15) ends[i].y = ends[i - 1].y + 15;
  const over = ends.length ? ends[ends.length - 1].y - (H - M.b) : 0;
  if (over > 0) ends.forEach(e => e.y -= over);
  svg.select(".labels").selectAll("text").data(narrow ? [] : ends, d => d.key).join("text")
    .attr("class", "dlabel").attr("x", W - M.r + 10).attr("dy", "0.32em").text(d => contName(d.key))
    .transition(t).attr("y", d => d.y);

  const xh = svg.select(".xhair").attr("y1", M.t).attr("y2", H - M.b);
  svg.select(".hit").attr("x", M.l - 10).attr("y", 0).attr("width", W - M.l - M.r + 20).attr("height", H).style("cursor", "pointer")
    .on("pointermove", ev => {
      const yr = snapYear(x, d3.pointer(ev)[0]);
      xh.attr("x1", x(yr)).attr("x2", x(yr)).attr("opacity", 1);
      const vals = series.map(s => ({ key: s.key, v: s.values.find(d => d.year === yr) })).filter(s => s.v).sort((a, b) => b.v.value - a.v.value);
      setTip(tp => {
        tp.append(el("div", "tip-t", String(yr)));
        for (const s of vals) {
          const r = el("div", "tip-row"); const i = el("i"); i.style.setProperty("--c", `var(${CONT[s.key].c})`);
          r.append(i, el("span", "tip-s", contName(s.key)), el("b", null, m.fmt(s.v.value)));
          tp.append(r);
        }
        tp.append(el("div", "tip-s", L.trendClick));
      });
      moveTip(ev);
    })
    .on("pointerleave", ev => { xh.attr("opacity", 0); if (ev.pointerType !== "touch") hideTip(); })
    .on("click", ev => { stopPlay(); state.year = snapYear(x, d3.pointer(ev)[0]); update(); });

  $("trend-legend").replaceChildren(...series.map(s => { const sp = el("span"); const i = el("i"); i.style.setProperty("--c", `var(${CONT[s.key].c})`); sp.append(i, contName(s.key)); return sp; }));
  $("trend-sub").textContent = state.metric === "population" ? L.trendSubPop : fill(L.trendSub, { unit: L.units[state.metric] });
  $("trend-title").textContent = fill(L.trendTitle, { metric: metricName() });

  // accessible table view: years down, continents across
  const tbl = $("tbl-trend").querySelector("table");
  const hr = el("tr"); hr.append(el("th", null, L.thYear), ...series.map(s => el("th", "num", contName(s.key))));
  tbl.tHead.replaceChildren(hr);
  tbl.tBodies[0].replaceChildren(...YEARS.map(yr => {
    const tr = el("tr"); tr.append(el("td", null, yr));
    for (const s of series) { const v = s.values.find(d => d.year === yr); tr.append(el("td", "num", v ? m.fmt(v.value) : "—")); }
    return tr;
  }));
}

// ---------- KPIs ----------
function renderKpi(r) {
  const m = METRICS[state.metric];
  $("k1-k").textContent = state.metric === "population" ? fill(L.kpiPop, { year: state.year }) : `${metricName()}, ${state.year}`;
  $("k1-v").textContent = r.value_now == null ? "—" : m.fmt(r.value_now);
  $("k1-s").textContent = state.metric === "population" ? L.kpiSum : L.kpiWeighted;
  if (r.value_now != null && r.value_base != null) {
    if (state.metric === "life_expectancy") {
      const d = r.value_now - r.value_base;
      $("k2-v").textContent = (d >= 0 ? "+" : "−") + F.yrs(Math.abs(d));
    } else {
      $("k2-v").textContent = "×" + F.n1.format(r.value_now / r.value_base);
    }
    $("k2-s").textContent = fill(L.kpiWas, { v: m.fmt(r.value_base), from: RANGE.from });
  } else {
    $("k2-v").textContent = "—"; $("k2-s").textContent = " ";
  }
  $("k3-v").textContent = r.leader ? F.country(r.leader_iso, r.leader) : "—";
  $("k3-s").textContent = r.leader_value == null ? "" : m.fmt(r.leader_value);
  $("k4-v").textContent = r.countries;
  $("k4-s").textContent = fill(L.kpiOf, { n: engine.countries }) + (r.missing ? " · " + fill(L.kpiMissing, { m: r.missing }) : "");
}

// ---------- update loop ----------
function renderAll(animate) {
  renderMap(last.map.rows, animate); showSql("sql-map", last.map.sql, last.map.ms);
  renderRank(last.rank.rows); showSql("sql-rank", last.rank.sql, last.rank.ms);
  renderTrend(last.trend.rows, animate); showSql("sql-trend", last.trend.sql, last.trend.ms);
  renderKpi(last.kpi.rows[0]);
}
async function update(animate = true) {
  $("year").value = state.year;
  $("year-big").textContent = state.year;
  if (!conn) return;
  const v = ++version;
  document.querySelectorAll(".card").forEach(c => c.classList.add("is-busy"));
  const run = async (key, sql) => { const r = await q(sql); return [key, { ...r, sql }]; };
  try {
    const res = [await run("map", sqlMap()), await run("rank", sqlRank()), await run("trend", sqlTrend()), await run("kpi", sqlKpi())];
    if (v !== version) return; // a newer filter state is already on its way
    for (const [k, r] of res) last[k] = r;
    renderAll(animate);
  } catch (e) {
    console.error(e);
  } finally {
    if (v === version) document.querySelectorAll(".card").forEach(c => c.classList.remove("is-busy"));
  }
}

// ---------- console ----------
const PRESETS = [
`SELECT continent,
       COUNT(*)                          AS countries,
       ROUND(MEDIAN(life_expectancy), 1) AS median_life_expectancy,
       ROUND(SUM(gdp_per_capita * population)
             / SUM(population) FILTER (WHERE gdp_per_capita IS NOT NULL)) AS gdp_per_capita_weighted
FROM world
WHERE year = 2023
GROUP BY continent
ORDER BY median_life_expectancy DESC;`,
`SELECT country, continent,
       ROUND(MAX(life_expectancy) FILTER (WHERE year = 2023)
           - MAX(life_expectancy) FILTER (WHERE year = 1990), 1) AS gain_years
FROM world
GROUP BY country, continent
ORDER BY gain_years DESC
LIMIT 10;`,
`-- life expectancy in 2019 vs. the lowest point of 2020–2021
SELECT country, continent,
       MAX(life_expectancy) FILTER (WHERE year = 2019)          AS le_2019,
       MIN(life_expectancy) FILTER (WHERE year IN (2020, 2021)) AS le_low,
       ROUND(le_low - le_2019, 1)                               AS change_years
FROM world
GROUP BY country, continent
ORDER BY change_years
LIMIT 10;`,
`WITH changes AS (
  SELECT country, year,
         gdp_per_capita / LAG(gdp_per_capita) OVER (PARTITION BY country ORDER BY year) - 1 AS growth
  FROM world
)
SELECT country,
       COUNT(*) FILTER (WHERE growth < 0) AS years_of_decline,
       ROUND(MIN(growth) * 100, 1)        AS worst_drop_pct
FROM changes
GROUP BY country
HAVING COUNT(growth) > 0
ORDER BY years_of_decline DESC, worst_drop_pct
LIMIT 10;`,
"DESCRIBE world;",
];
function buildConsole() {
  const box = $("presets");
  PRESETS.forEach(sql => {
    const b = el("button"); b.type = "button";
    b.onclick = () => { $("sql-input").value = sql; runConsole(); };
    box.append(b);
  });
  $("sql-input").value = PRESETS[0];
  $("run").onclick = runConsole;
  $("reset").onclick = async () => {
    if (!sandbox) return;
    await resetSandbox();
    const meta = $("run-meta"); meta.className = "run-meta"; meta.dataset.used = "1"; meta.textContent = L.resetDone;
  };
  $("sql-input").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); runConsole(); }
  });
}
// The console gets its own connection pointed at a copy of the table,
// so DROP/UPDATE typed by a visitor never reaches the dashboard's data.
async function resetSandbox() {
  await sandbox.query("ATTACH IF NOT EXISTS ':memory:' AS sandbox");
  await sandbox.query(`CREATE OR REPLACE TABLE sandbox.world AS SELECT * FROM "${mainDb}".main.world`);
  await sandbox.query("USE sandbox");
}
async function runConsole() {
  if (!sandbox) return;
  const sql = $("sql-input").value.trim();
  if (!sql) return;
  const meta = $("run-meta"), out = $("result"), btn = $("run");
  meta.dataset.used = "1";
  btn.disabled = true;
  try {
    const r = await q(sql, sandbox);
    meta.className = "run-meta";
    if (!r.fields.length) { meta.textContent = fill(L.ok, { ms: F.ms(r.ms) }); out.hidden = true; return; }
    meta.textContent = `${F.rows(r.rows.length)} · ${F.ms(r.ms)}${r.rows.length > 200 ? " · " + L.rowsShown : ""}`;
    const table = el("table"), thead = el("thead"), tr = el("tr");
    r.fields.forEach(f => tr.append(el("th", null, f)));
    thead.append(tr); table.append(thead);
    const tb = el("tbody");
    for (const row of r.rows.slice(0, 200)) {
      const trr = el("tr");
      for (const f of r.fields) {
        const v = row[f];
        const isNum = typeof v === "number";
        const text = v == null ? "NULL" : isNum ? F.n2.format(v) : typeof v === "object" ? JSON.stringify(v, (_, x) => typeof x === "bigint" ? Number(x) : x) : String(v);
        trr.append(el("td", isNum ? "num" : null, text));
      }
      tb.append(trr);
    }
    table.append(tb);
    out.replaceChildren(table); out.hidden = false;
  } catch (e) {
    meta.className = "run-meta err";
    meta.textContent = L.err + String(e.message || e).split("\n")[0];
    out.hidden = true;
  } finally { btn.disabled = false; }
}

// ---------- boot ----------
async function boot() {
  buildTopbar();
  buildControls();
  buildConsole();
  ["map", "rank", "trend"].forEach(id => { $(id).dataset.loading = ""; });
  applyLang();
  const t0 = performance.now();
  try {
    const parquetP = fetch("data/world.parquet").then(r => { if (!r.ok) throw new Error("data/world.parquet: HTTP " + r.status); return r.arrayBuffer(); });
    world = await (await fetch("data/countries-110m.json")).json();
    drawMapBase();
    const bundle = await duckdb.selectBundle(duckdb.getJsDelivrBundles());
    const workerUrl = URL.createObjectURL(new Blob([`importScripts("${bundle.mainWorker}");`], { type: "text/javascript" }));
    const db = new duckdb.AsyncDuckDB(new duckdb.VoidLogger(), new Worker(workerUrl));
    await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
    URL.revokeObjectURL(workerUrl);
    const buf = new Uint8Array(await parquetP);
    const bytes = buf.byteLength; // read before the buffer is transferred to the worker
    await db.registerFileBuffer("world.parquet", buf);
    conn = await db.connect();
    await conn.query("CREATE TABLE world AS SELECT * FROM read_parquet('world.parquet')");
    mainDb = (await q("SELECT current_database() AS d")).rows[0].d;
    sandbox = await db.connect();
    await resetSandbox();
    const d = (await q(`SELECT MIN(life_expectancy) AS a, MAX(life_expectancy) AS b,
                               MIN(gdp_per_capita) AS c, MAX(gdp_per_capita) AS d,
                               MIN(population)::DOUBLE AS e, MAX(population)::DOUBLE AS f,
                               MIN(year)::INTEGER AS y0, MAX(year)::INTEGER AS y1,
                               COUNT(*)::INTEGER AS n, COUNT(DISTINCT country)::INTEGER AS k FROM world`)).rows[0];
    domains = { life_expectancy: [d.a, d.b], gdp_per_capita: [d.c, d.d], population: [d.e, d.f] };
    RANGE.from = d.y0; RANGE.to = d.y1;
    YEARS = d3.range(RANGE.from, RANGE.to + 1);
    Object.assign($("year"), { min: RANGE.from, max: RANGE.to });
    if (state.year < RANGE.from || state.year > RANGE.to) state.year = RANGE.to;
    drawMapDots((await q("SELECT DISTINCT iso_num, lon, lat FROM world")).rows);
    applyLang();
    Object.assign(engine, { state: "ready", secs: (performance.now() - t0) / 1000, rows: d.n, bytes, countries: d.k });
    renderEngine();
    ["map", "rank", "trend"].forEach(id => { delete $(id).dataset.loading; });
    await update(false);
  } catch (e) {
    console.error(e);
    engine.state = "error";
    renderEngine();
    ["map", "rank", "trend"].forEach(id => { $(id).dataset.loading = L.engError; });
  }
}

let rz;
new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => last.trend && renderTrend(last.trend.rows, false), 120); }).observe($("trend"));
const onTheme = () => { syncTopbar(); if (last.map) renderMap(last.map.rows, false); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

boot();
</script>
